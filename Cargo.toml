[package]
name = "s3xc"
version = "0.1.0"
edition = "2021"
authors = ["LangDuaMC"]
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "tokio"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io", "codec"] }
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.32", features = ["serialize"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
url = "2"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dashmap = "5"
http-body-util = "0.1"
hmac = "0.12"




